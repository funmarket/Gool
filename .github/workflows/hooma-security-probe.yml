name: HOOMA Security Probe

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/hooma-rebrand'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_ci?schema=public
      TELEGRAM_BOT_TOKEN: ci-placeholder
      TELEGRAM_WEBHOOK_SECRET: ci-placeholder
      DEV_AUTH_BYPASS: 'false'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooma_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency override
        run: |
          node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('./node_modules/deepmerge-ts/package.json', 'utf8')); if (pkg.version !== '8.0.1') { console.error('Expected deepmerge-ts 8.0.1, found ' + pkg.version); process.exit(1); } console.log('deepmerge-ts ' + pkg.version);"
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_ENV: test
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run security:check
