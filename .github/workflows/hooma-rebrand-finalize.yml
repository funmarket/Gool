name: HOOMA Rebrand Finalize

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebrand branch
        uses: actions/checkout@v4
        with:
          ref: chore/hooma-rebrand
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Rename legacy input class
        shell: bash
        run: |
          matches=$(grep -RIl --include='*.ts' --include='*.tsx' --include='*.css' 'gool-input' apps/miniapp/src || true)
          if [ -n "$matches" ]; then
            while IFS= read -r file; do
              sed -i 's/gool-input/hooma-input/g' "$file"
            done <<< "$matches"
          fi
          if grep -RIn --include='*.ts' --include='*.tsx' --include='*.css' 'gool-input' apps/miniapp/src; then
            echo 'Legacy gool-input identifier still exists.'
            exit 1
          fi

      - name: Regenerate npm lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify active workspace namespace
        shell: bash
        run: |
          if grep -RIn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' '@gool/' apps packages tests; then
            echo 'Legacy @gool workspace namespace still exists in active code.'
            exit 1
          fi

      - name: Commit finalization result
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No finalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/miniapp/src package-lock.json
          git commit -m 'chore: finalize HOOMA technical identifiers and lockfile'
          git push origin HEAD:chore/hooma-rebrand
