name: HOOMA Runner Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - chore/hooma-rebrand
    paths:
      - .github/workflows/hooma-runner-diagnostic.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnostic:
    name: GitHub-hosted runner diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: chore/hooma-rebrand

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Capture runner toolchain
        run: |
          set -euo pipefail
          {
            echo "RUNNER_OS=${RUNNER_OS}"
            echo "GITHUB_REF=${GITHUB_REF}"
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo "CHECKOUT_HEAD=$(git rev-parse HEAD)"
            echo "NODE_VERSION_BEFORE_NPM_SWITCH=$(node --version)"
            echo "BUNDLED_NPM_VERSION=$(npm --version)"
            echo "BUNDLED_NPM_REGISTRY=$(npm config get registry)"
          } | tee runner-diagnostic.txt

      - name: Use npm 10.9.2 inside runner
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare npm@10.9.2 --activate
          {
            echo "NODE_VERSION=$(node --version)"
            echo "NPM_VERSION=$(npm --version)"
            echo "NPM_REGISTRY=$(npm config get registry)"
            echo "NPM_PING_BEGIN"
            npm ping
            echo "NPM_PING_END"
            echo "GIT_HEAD=$(git rev-parse HEAD)"
            git status --short --branch
          } | tee -a runner-diagnostic.txt

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: hooma-runner-diagnostic
          path: runner-diagnostic.txt
          if-no-files-found: error
