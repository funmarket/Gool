name: HOOMA Lockfile Refresh

on:
  push:
    branches:
      - chore/hooma-rebrand
    paths:
      - .github/workflows/hooma-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/hooma-rebrand
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate package lock from manifests
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify HOOMA workspace identity
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            '': 'hooma',
            'apps/api': '@hooma/api',
            'apps/miniapp': '@hooma/miniapp',
            'packages/contracts': '@hooma/contracts',
            'packages/database': '@hooma/database',
          };
          for (const [path, name] of Object.entries(expected)) {
            if (lock.packages?.[path]?.name !== name) {
              throw new Error(`Unexpected lockfile package name for ${path || '<root>'}: ${lock.packages?.[path]?.name}`);
            }
          }
          for (const name of ['api', 'miniapp', 'contracts', 'database']) {
            if (!lock.packages?.[`node_modules/@hooma/${name}`]?.link) {
              throw new Error(`Missing HOOMA workspace link: @hooma/${name}`);
            }
            if (lock.packages?.[`node_modules/@gool/${name}`]) {
              throw new Error(`Legacy GOOL workspace link remains: @gool/${name}`);
            }
          }
          if (JSON.stringify(lock).includes('@gool/')) {
            throw new Error('Legacy @gool/ namespace remains in package-lock.json');
          }
          NODE
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches the HOOMA manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate lockfile for HOOMA workspaces"
          git push origin HEAD:chore/hooma-rebrand
