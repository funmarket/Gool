name: Phase D Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'feat/server-hybrid-auth'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hooma_phase_d
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_phase_d?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hooma_phase_d?schema=public
      TELEGRAM_BOT_TOKEN: phase-d-placeholder
      TELEGRAM_WEBHOOK_SECRET: phase-d-placeholder
      BETTER_AUTH_SECRET: phase-d-bootstrap-secret-at-least-thirty-two-characters
      AUTH_BASE_URL: http://localhost:3000
      DEV_AUTH_BYPASS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Normalize bootstrap helper syntax
        run: node scripts/phase-d-bootstrap-fix.mjs
      - name: Apply Phase D source changes
        run: node scripts/phase-d-apply.mjs
      - name: Install pinned Better Auth dependencies
        run: npm install --save-exact -w @hooma/api better-auth@1.6.29 @better-auth/prisma-adapter@1.6.29
      - name: Format changed application sources
        run: >-
          npx prettier --write
          apps/api/src/auth/better-auth.ts
          apps/api/src/bootstrap/app.ts
          apps/api/src/bootstrap/container.ts
          apps/api/src/config/env.ts
          apps/api/src/http/middleware/auth.ts
          apps/api/src/modules/identity/application/identity-repository.ts
          apps/api/src/modules/identity/application/identity.service.ts
          apps/api/src/modules/identity/infrastructure/prisma-identity.repository.ts
          tests/hybrid-auth-schema.test.ts
          .github/workflows/ci.yml
          apps/api/package.json
          package-lock.json
      - name: Format Prisma schema
        run: npm -w @hooma/database exec prisma format
      - name: Validate Prisma
        run: npm run db:validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build database package
        run: npm -w @hooma/database run build
      - name: Build contracts package
        run: npm -w @hooma/contracts run build
      - name: Typecheck API
        run: npm -w @hooma/api run typecheck
      - name: Run repository tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Validate migration from clean database
        run: npm run db:migrate:deploy
      - name: Remove temporary bootstrap files
        run: rm scripts/phase-d-apply.mjs scripts/phase-d-bootstrap-fix.mjs .github/workflows/phase-d-bootstrap.yml
      - name: Commit generated Phase D implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add canonical email username password auth"
          git push origin HEAD:${{ github.head_ref }}
